<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ibrahima Sylla</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://www.ibrahimasylla.com/en" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <noscript><meta http-equiv="refresh" content="0;url=/en" /></noscript>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        font-family: ui-serif, Georgia, serif;
        background: #f7f6f1;
        color: #10171f;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0a111a; color: #efede7; }
      }
      main { text-align: center; }
      h1 { margin: 0 0 1.5rem; font-weight: 400; font-size: 2.5rem; letter-spacing: -0.02em; }
      a { color: inherit; margin: 0 0.75rem; font-family: ui-sans-serif, system-ui, sans-serif; }
    </style>
    <script>
      var languages = navigator.languages || [navigator.language || "en"];
      var preferred = "en";
      for (var i = 0; i < languages.length; i++) {
        var code = String(languages[i]).slice(0, 2).toLowerCase();
        if (code === "fr" || code === "en") {
          preferred = code;
          break;
        }
      }
      location.replace("/" + preferred);
    </script>
  </head>
  <body>
    <main>
      <h1>Ibrahima Sylla</h1>
      <p>
        <a href="/en" hreflang="en" lang="en">English</a>
        <a href="/fr" hreflang="fr" lang="fr">Français</a>
      </p>
    </main>
  </body>
</html>
